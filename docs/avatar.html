<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 640px; height: 640px; }
  body {
    display: grid; place-items: center;
    background: radial-gradient(circle at 50% 38%, #24407a 0%, #122347 55%, #0a1430 100%);
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; color: #fff;
  }
  .logo { text-align: center; transform: translateY(-6px); }
  .icon { font-size: 128px; line-height: 1; }
  .name { font-size: 104px; font-weight: 800; letter-spacing: -2px; margin-top: 18px; }
  .kind { font-size: 30px; font-weight: 600; letter-spacing: 10px; color: #9fb8ff; margin-top: 8px; }
</style>
<body>
  <div class="logo">
    <div class="icon">✂️</div>
    <div class="name">Лезвие</div>
    <div class="kind">BARBERSHOP</div>
  </div>
</body>
</html>
