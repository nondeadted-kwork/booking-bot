<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 640px; height: 360px; overflow: hidden; }
  body {
    background: radial-gradient(circle at 28% 40%, #24407a 0%, #122347 55%, #0a1430 100%);
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; color: #fff;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 36px 0 40px; box-sizing: border-box;
  }
  .left { display: flex; flex-direction: column; }
  .pill {
    align-self: flex-start; font-size: 12px; font-weight: 700; letter-spacing: 2px;
    color: #0a1430; background: #9fb8ff; border-radius: 999px; padding: 5px 12px;
  }
  .name { font-size: 66px; font-weight: 800; letter-spacing: -1.5px; line-height: 1; margin-top: 16px; }
  .kind { font-size: 15px; font-weight: 600; letter-spacing: 7px; color: #9fb8ff; margin-top: 8px; }
  .sub { font-size: 17px; color: #d5e0ff; margin-top: 18px; line-height: 1.35; }
  .hint { font-size: 13px; color: #9fb8ff; margin-top: 22px; }
  .features { display: flex; flex-direction: column; gap: 12px; }
  .row { display: flex; align-items: center; gap: 12px; font-size: 16px; font-weight: 600; }
  .icon {
    width: 38px; height: 38px; border-radius: 11px; background: rgba(159, 184, 255, 0.16);
    border: 1px solid rgba(159, 184, 255, 0.35); display: grid; place-items: center;
  }
  .icon svg { width: 20px; height: 20px; stroke: #fff; fill: none; stroke-width: 2;
              stroke-linecap: round; stroke-linejoin: round; }
</style>
<body>
  <div class="left">
    <div class="pill">ДЕМО-БОТ</div>
    <div class="name">Лезвие</div>
    <div class="kind">BARBERSHOP</div>
    <div class="sub">Запись к барберу за полминуты<br>прямо в Telegram</div>
    <div class="hint">Нажмите «Старт», чтобы попробовать</div>
  </div>
  <div class="features">
    <div class="row">
      <div class="icon"><svg viewBox="0 0 24 24"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/>
        <path d="M20 4 8.1 15.9M14.5 14.5 20 20M8.1 8.1 12 12"/></svg></div>
      Выбор барбера
    </div>
    <div class="row">
      <div class="icon"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/>
        <path d="M16 3v4M8 3v4M3 10h18M8 14h2M14 14h2M8 17h2"/></svg></div>
      Свободные окна
    </div>
    <div class="row">
      <div class="icon"><svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/>
        <path d="M2 10h20M6 15h4"/></svg></div>
      Оплата в боте
    </div>
    <div class="row">
      <div class="icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/>
        <path d="M12 9v4l2.5 2.5M5 3 2 6M19 3l3 3"/></svg></div>
      Напоминание за час
    </div>
    <div class="row">
      <div class="icon"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></div>
      Панель владельца
    </div>
  </div>
</body>
</html>
