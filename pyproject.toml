[project]
name = "booking-bot"
version = "1.0.0"
description = "Telegram-бот записи на услуги: слоты, оплата, напоминания, панель владельца"
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"
