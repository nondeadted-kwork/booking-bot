services:
  bot:
    build: .
    env_file: .env
    environment:
      DB_PATH: /app/data/bot.db
    volumes:
      - ./data:/app/data          # база переживает пересборку контейнера
    restart: unless-stopped       # упал — поднимется сам; перезагрузили VPS — тоже
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
